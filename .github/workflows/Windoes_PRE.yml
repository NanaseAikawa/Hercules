name: Build Hercules Windows Binaries

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/cache/restore@v4
        name: restore conan cache
        id: cache
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-msvc-${{ hashFiles('conanfile.py') }}

      - name: build
        run: |
          .\tools\ci\windows.ps1 build -DENABLE_RENEWAL=OFF -DPACKETVER=20190605

      # Wir suchen jetzt überall nach den Exen, damit der Upload nicht fehlschlägt!
      - name: Upload Compiled Executables
        uses: actions/upload-artifact@v4
        with:
          name: Hercules-Server-Binaries
          path: |
            login-server.exe
            char-server.exe
            map-server.exe
            build/bin/Release/login-server.exe
            build/bin/Release/char-server.exe
            build/bin/Release/map-server.exe
