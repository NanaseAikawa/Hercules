name: Build Hercules Windows Binaries

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache Conan Packages
      id: cache-conan
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: ${{ runs-on }}-conan-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}
        restore-keys: |
          ${{ runs-on }}-conan-

    - name: Install Conan & CMake
      run: |
        pip install conan
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --force

    - name: Configure Conan
      run: |
        conan profile detect --force

    - name: Install Dependencies via Conan
      run: |
        mkdir build
        cd build
        conan install .. --output-folder=. --build=missing -s build_type=Release

    - name: Configure CMake (Pre-RE, Client-Datum & cJSON)
      run: |
        cd build
        cmake .. -A x64 -DPRERE=ON -DPACKETVER=20190605 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/generators/conan_toolchain.cmake"

    - name: Build Server Binaries
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Compiled Executables
      uses: actions/upload-artifact@v4
      with:
        name: Hercules-Server-Binaries
        path: |
          build/bin/Release/login-server.exe
          build/bin/Release/char-server.exe
          build/bin/Release/map-server.exe
