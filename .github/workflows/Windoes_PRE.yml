name: Build Hercules Windows Binaries

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Configure CMake (Pre-RE & Client-Datum)
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DPRERE=ON -DPACKETVER=20190605

    - name: Build Server Binaries
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Compiled Executables
      uses: actions/upload-artifact@v4
      with:
        name: Hercules-Server-Binaries
        path: |
          build/bin/Release/login-server.exe
          build/bin/Release/char-server.exe
          build/bin/Release/map-server.exe
